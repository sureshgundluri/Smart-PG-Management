<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h2>Registration</h2>
    <input type="text" id="username" placeholder="Username"><br><br>
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <input type="text" id="pg_name" placeholder="PG Name"><br><br>
    <input type="text" id="pg_address" placeholder="PG Address"><br><br>
    <button onclick="register()">Register</button>
    <script>
        function register(){
            let username = document.getElementById("username").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let pgname = document.getElementById("pg_name").value;
            let pgaddress = document.getElementById("pg_address").value;

            fetch("http://127.0.0.1:8000/api/register/",{
                method:"POST",
                headers: {
          "Content-Type": "application/json"
            },
            body: JSON.stringify({
          username: username,
          email : email,
          password: password,
          pg_name: pgname,
          pg_address: pgaddress
            })
            })
            .then(response => {
        if (!response.ok) {
            throw new Error("Server error");
        }
        return response.json();
        })
            .then(data => {
                alert("Registered Successfully");
                console.log(data)
            })
            .catch(error =>{
               alert("Registration failed ❌");
               console.error(error);
            });

        }
    </script>
</body>
</html>
